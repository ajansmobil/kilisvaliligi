<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <!-- Mobilde tam ekran ve sabit olcek davranisi icin viewport ayarlari uygulanir. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <!-- Mobil tarayicilarda uygulama benzeri gorunum elde etmek icin web app metasi eklenir. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Kilis Sehir Atlasi</title>
    <style>
      :root {
        --bg-main: #0f2f96;
        --bg-button: #0a236f;
        --text-main: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      /* Sayfayi mobil uygulama ekrani gibi gostermek icin govdeyi ortaliyoruz. */
      body {
        margin: 0;
        min-height: 100dvh;
        font-family: Arial, Helvetica, sans-serif;
        background-color: var(--bg-main);
        /* Arka plan gorseli kullanicinin belirttigi bg.jpeg dosyasina baglandi. */
        background-image: url("./bg.jpeg");
        background-repeat: no-repeat;
        background-position: center top;
        background-size: cover;
        color: var(--text-main);
        display: flex;
        justify-content: center;
        align-items: center;
        overflow-x: hidden;
        overflow-y: auto;
      }

      /* Icerik kapsayicisi mobil cihazlarda maksimum 420px genislikte kalir. */
      .app {
        width: min(100%, 420px);
        margin: auto;
        padding: 18px 22px 28px;
        display: flex;
        flex-direction: column;
        /* Baslik ve menu blogu ekranin tam ortasinda kalir. */
        justify-content: center;
        align-items: center;
        gap: 14px;
      }

      .brand {
        width: 100%;
        margin-top: 12px;
        display: flex;
        justify-content: center;
      }

      .brand img {
        width: min(100%, 290px);
        height: auto;
        object-fit: contain;
      }

      .title {
        margin: 0 0 18px;
        text-align: center;
        font-weight: 700;
        letter-spacing: 1.2px;
        line-height: 1.3;
        /* Baslik metni kullanici talebine gore biraz kucultuldu. */
        font-size: 24px;
      }

      .menu {
        /* Menu, basliktan sonra sabit boslukla gelmesi icin ust marjin sifirlandi. */
        margin-top: 0;
        /* Menu blogu ekran ortasina sabit genislikte konumlanir. */
        width: min(100%, 360px);
        display: flex;
        flex-direction: column;
        /* Menu grubundaki her buton yatay eksende ortalanir. */
        align-items: center;
        margin-inline: auto;
        gap: 10px;
      }

      /* Menu butonlarini referans gorsele benzer sekilde koyu mavi ve oval yapiyoruz. */
      .menu a {
        /* Butonlar menu blogunun tamamini kaplayarak tam ortada durur. */
        width: 100%;
        display: block;
        text-decoration: none;
        text-align: center;
        color: var(--text-main);
        background-color: rgba(10, 35, 111, 0.92);
        border-radius: 14px;
        padding: 11px 10px;
        /* 6 menu basligi icin metin boyutu biraz kucultuldu. */
        font-size: 18px;
        font-weight: 500;
        letter-spacing: 0.8px;
        transition: transform 0.2s ease, background-color 0.2s ease;
      }

      .menu a:hover,
      .menu a:focus-visible {
        background-color: #0d2f93;
        transform: translateY(-1px);
      }

      /* Telefon yatay modda acildiginda kullaniciya dik konuma gecmesi gerektigi net mesajla gosterilir. */
      .orientation-warning {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 999;
        background: rgba(8, 28, 92, 0.97);
        color: #ffffff;
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.8px;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      /* Yatay mod uyarisi yalnizca mobil telefonlarda gosterilir; masaustu landscape ekranlari etkilenmez. */
      @media (orientation: landscape) and (max-height: 500px) {
        .app {
          display: none;
        }

        .orientation-warning {
          display: flex;
        }
      }

      @media (max-width: 420px) {
        .title {
          font-size: 20px;
        }

        .menu a {
          font-size: 16px;
          padding: 10px 8px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Mobil cihaz yatay konuma gecerse kullaniciya uygulamayi dik kullanma talimati verilir. -->
    <div class="orientation-warning">Lutfen telefonu dik konumda kullanin.</div>
    <main class="app">
    

      <!-- Baslik: Kilis Sehir Atlasi ana marka adi olarak gosterilir. -->
      <section class="title">
        KİLİS<br />
        ŞEHİR ATLASI
      </section>

      <!-- Sehir Atlasi ana menusu — kullanici talebine gore 6 bolum halinde duzenlendi. -->
      <nav class="menu" aria-label="Ana menu">
        <!-- 1. Kilis genel katalog PDF (turizm rehberi) — tamamlandi. -->
        <a href="./www.gap.gov.tr_285_SD0L39HF.pdf" target="_blank" rel="noopener noreferrer">KİLİS TURİZM REHBERİ</a>
        <!-- 2. Tanitim filmi — video dosyasi public klasorune eklendiginde acilir. -->
        <a href="./kilis-tanitim-filmi.mp4" target="_blank" rel="noopener noreferrer">KİLİS TANITIM FİLMİ</a>
        <!-- 3. Turizm haritasi belgesi — indirilebilir PDF olarak sunulur. -->
        <a href="./a2.pdf" download="kilis-turizm-haritasi.pdf">KİLİS TURİZM HARİTASI</a>
        <!-- 4. Kilis kultur kutuphanesi — kitap PDF'leri ileride bu sayfaya eklenecek. -->
        <a href="./kutuphane/">KİLİS KÜLTÜR KÜTÜPHANESİ</a>
        <!-- 5. Destinasyon haritasi — oren ve tarihi yerlerin interaktif harita uygulamasi. -->
        <a href="./map/">DESTİNASYON HARİTASI</a>
        <!-- 6. Resmi Kilis Valiligi web sitesine yonlendirme. -->
        <a href="https://www.kilis.gov.tr/" target="_blank" rel="noopener noreferrer">KİLİS VALİLİĞİ</a>
      </nav>
    </main>

    <script>
      /* Destekleyen cihazlarda ekran yonunu dik moda kilitlemeyi deneriz; destek yoksa CSS uyarisi devrede kalir. */
      (async function tryLockPortrait() {
        try {
          if (screen.orientation && typeof screen.orientation.lock === "function") {
            await screen.orientation.lock("portrait");
          }
        } catch (_error) {
          /* Bircok mobil tarayici bu ozelligi izinlere bagli tuttugu icin hata sessizce yoksayilir. */
        }
      })();
    </script>
  </body>
</html>
