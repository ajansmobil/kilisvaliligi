<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Kilis Valiliği — Harita görselini yakınlaştırarak inceleyin">
  <meta name="theme-color" content="#3d4238">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Harita Görüntüleyici</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>

  <!-- İlk yükleme ekranı: büyük görsel indirilirken gösterilir -->
  <div id="yukleniyor" class="yukleniyor">
    <div class="yukleniyor-spinner"></div>
    <p>Harita hazırlanıyor…</p>
  </div>

  <!-- Hata durumu: gorsel parametresi eksikse veya görsel açılamazsa gösterilir -->
  <div id="hata" class="hata" hidden>
    <p id="hata-metin">Görsel yüklenemedi.</p>
    <a href="../" class="hata-geri">‹ Ana sayfaya dön</a>
  </div>

  <!-- Üst bilgi çubuğu -->
  <header class="ust-bar">
    <button id="geri-btn" class="geri-btn" aria-label="Geri dön">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>
    <h1 id="harita-baslik" class="harita-baslik">Harita</h1>
    <div class="ust-bar-sag">
      <a id="indir-btn" class="indir-btn" aria-label="Görseli indir" download>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3v12"/>
          <polyline points="7 11 12 16 17 11"/>
          <line x1="4" y1="20" x2="20" y2="20"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- Zoom / pan alanı -->
  <main id="harita-viewport" class="harita-viewport">
    <img id="harita-img" class="harita-img" alt="" draggable="false">
  </main>

  <!-- Yakınlaştırma kontrolleri -->
  <div class="zoom-kontroller">
    <button id="yakinlastir-btn" class="zoom-btn" aria-label="Yakınlaştır">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="11" y1="8" x2="11" y2="14"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button id="uzaklastir-btn" class="zoom-btn" aria-label="Uzaklaştır">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="7"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
        <line x1="8" y1="11" x2="14" y2="11"/>
      </svg>
    </button>
    <button id="sifirla-btn" class="zoom-btn" aria-label="Görünümü sıfırla">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 1 3 6.7"/>
        <polyline points="3 20 3 15 8 15"/>
      </svg>
    </button>
  </div>

  <!-- Mobilde ilk açılışta kısa süre görünen dokunma ipucu -->
  <div id="dokunma-ipucu" class="dokunma-ipucu">İki parmakla yakınlaştırın veya sürükleyin</div>

  <script src="js/goruntule.js"></script>
</body>
</html>
